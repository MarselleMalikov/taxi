<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Такси-игра</title>
<style>
:root{--g:#22b455;--o:#f08a1c;--b:#2f6fed;--r:#e5484d;--ink:#1b1d22;--m:#6b7280;--c:#f3f4f6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0f1218;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
button{font-family:inherit}
#app{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#f3f0e8}
#map{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
#topbar{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;pointer-events:none}
.pill{background:rgba(255,255,255,.96);border-radius:14px;padding:7px 11px;box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:13px}
#earn{flex:1;min-width:0}
.money{font-size:20px;font-weight:700;color:#16883f;line-height:1.1}
.sub{font-size:11px;color:var(--m);margin-top:1px}
.gbar{height:4px;background:#e1e4ea;border-radius:2px;margin-top:5px;overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:var(--g);transition:width .4s}
#statuspill{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#9aa3b2}
.status.on .dot{background:var(--g)}.status.ride .dot{background:var(--b)}
#ratingpill{text-align:center;white-space:nowrap}
#rating{font-size:16px;font-weight:700;color:#d98f00}
#osm{position:absolute;z-index:2;left:10px;top:calc(env(safe-area-inset-top,0px) + 68px);font-size:10px;color:#555;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:6px}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:60%;overflow-y:auto}
.grab{display:block;width:40px;height:4px;border-radius:2px;background:#d5d8df;margin:-8px auto 12px}
#shift{display:block;width:100%;margin-top:6px;padding:14px;border:none;border-radius:14px;font-size:20px;font-weight:700;color:#fff;cursor:pointer;transition:background .25s}
#shift small{display:block;margin-top:2px;font-size:12px;font-weight:400;opacity:.92}
#shift.off{background:var(--o)}#shift.on{background:var(--g)}
#sheetfoot{text-align:center;margin-top:8px}
#reset{background:none;border:none;color:#9aa1af;font-size:12px;text-decoration:underline;cursor:pointer}
.offmsg{padding:6px 2px 8px}.offmsg b{display:block;font-size:18px}.offmsg small{color:var(--m);font-size:14px}
.search{display:flex;align-items:center;gap:14px;padding:8px 2px 10px}
.search b{display:block;font-size:17px}.search small{color:var(--m);font-size:13px}
.pulse{flex:none;position:relative;width:14px;height:14px;margin:0 6px;border-radius:50%;background:var(--g)}
.pulse::after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;background:var(--g);animation:ping 1.4s infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
.listhead{font-size:13px;color:var(--m);margin:0 2px 8px}
.ocard{background:var(--c);border-radius:14px;padding:12px;margin-bottom:10px;border:2px solid transparent;cursor:pointer}
.ocard.sel{border-color:var(--g);background:#fff}
.otop{display:flex;justify-content:space-between;align-items:baseline}
.orate{font-size:14px;color:var(--m)}.oprice{font-size:24px;font-weight:700}
.ohide{margin-top:8px;font-size:12px;color:var(--m)}
.obar{height:4px;background:#dfe2e8;border-radius:2px;margin-top:8px;overflow:hidden}
.obarfill{height:100%;width:100%;background:var(--g)}
.obtns{display:flex;gap:8px;margin-top:10px}
.obtns button{flex:1;padding:12px;font-size:16px;border:none;border-radius:12px;cursor:pointer}
.skip{background:#e3e6ec;color:var(--ink)}.obtns .take{flex:1.6;background:var(--g);color:#fff;font-weight:700}
.addr{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.addr b{display:block;font-size:17px}.addr small{color:var(--m);font-size:13px}
.dotA,.dotB{flex:none;width:12px;height:12px;border-radius:50%;margin-top:5px}
.dotA{background:var(--g)}.dotB{background:var(--r)}
.ridehead{display:flex;justify-content:space-between;align-items:center}
.chip{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:#e6efff;color:var(--b)}
.chip.green{background:#e3f6ea;color:#16883f}
.rprice{font-size:22px;font-weight:700;color:#16883f}
.rname{margin-top:10px;font-size:18px;font-weight:600}.rname span{font-size:14px;font-weight:400;color:var(--m);margin-left:6px}
.dialog{background:var(--c);border-radius:14px;padding:14px}
.who{font-size:13px;color:var(--m);margin-bottom:6px}.said{font-size:17px;line-height:1.4;margin-bottom:4px}
.choice{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;font-size:15px;color:var(--ink);background:#fff;border:1px solid #d9dce3;border-radius:12px;cursor:pointer}
.choice:hover{background:#eef1f6}
.result{background:#e8f7ee;border-radius:14px;padding:12px;margin-bottom:10px}
.rhead{display:flex;align-items:center;justify-content:space-between}
.result .x{background:none;border:none;font-size:22px;line-height:1;padding:0 4px;cursor:pointer;color:var(--ink)}
.rbig{font-size:26px;font-weight:700;color:#16883f;margin-top:4px}.rbig small{font-size:13px;font-weight:400;color:var(--m);margin-left:6px}
.rline{font-size:15px;margin-top:4px}.stars{color:#f5a300;letter-spacing:1px}.bad{color:#c0392b}
#ending{position:fixed;inset:0;background:rgba(10,12,18,.88);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:10}
#ending[hidden]{display:none}
#endcard{background:#2a3142;color:#fff;border:2px solid #7be08a;border-radius:16px;padding:22px;max-width:360px;width:100%}
#endcard h2{margin:0 0 4px;color:#7be08a;font-size:26px}
#endcard .title{color:#ffd166;font-size:18px;margin-bottom:14px}
#endcard .line{margin-top:7px;font-size:15px}
#endcard .sect{margin-top:16px;font-size:13px;opacity:.6;text-transform:uppercase}
.endbtn{display:block;width:100%;margin-top:10px;padding:12px;font-size:16px;border:none;border-radius:10px;color:#fff;background:#4a5163;cursor:pointer}
.endbtn.main{background:#2fa84f;font-weight:bold}
#ff{position:absolute;z-index:2;right:10px;top:calc(env(safe-area-inset-top,0px) + 68px);padding:6px 12px;border:none;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:14px;font-weight:700;cursor:pointer}
#ff[hidden]{display:none}
.dotS{flex:none;width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--o)}
.stopinfo{margin-top:12px;font-size:16px;font-weight:600;color:#b36b00;background:#fff4e0;border-radius:12px;padding:10px}
.kick{display:block;width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:#fde8e8;color:#b3261e;font-size:15px;cursor:pointer}
</style></head>
<body>
<div id="app">
  <canvas id="map"></canvas>
  <div id="topbar">
    <div class="pill" id="earn"><div class="money" id="money">0 ₽</div><div class="sub" id="goaltext"></div><div class="gbar"><i id="goalfill"></i></div></div>
    <div class="pill status off" id="statuspill"><span class="dot"></span><span><span id="statustext">Не на линии</span><div class="sub" id="clock"></div></span></div>
    <div class="pill" id="ratingpill"><div id="rating">★ 5.00</div><div class="sub" id="rides">поездок 0</div></div>
  </div>
  <div id="osm">© участники OpenStreetMap</div>
  <button id="ff" hidden>⏩ ×1</button>
  <div id="sheet"><span class="grab"></span><div id="panel"></div><button id="shift" class="off"></button>
    <div id="sheetfoot"><button id="reset">Сбросить прогресс</button></div></div>
</div>
<div id="ending" hidden><div id="endcard"></div></div>

<script src="dialogues.js"></script>
<script src="dialogues2.js"></script>
<script src="mapdata.js"></script>
<script>
// ====== Карта: дороги Уфы из mapdata.js (координаты в метрах) ======
const D = MAPDATA, N = D.nodes, W = D.w, H = D.h, $ = id => document.getElementById(id);
const appEl = $("app"), canvas = $("map"), ctx = canvas.getContext("2d"), panel = $("panel");
const moneyEl = $("money"), ridesEl = $("rides"), ratingEl = $("rating"), shiftBtn = $("shift"), footEl = $("sheetfoot");
const goalFill = $("goalfill"), goalText = $("goaltext"), statusPill = $("statuspill"), statusText = $("statustext");
const endingEl = $("ending"), endCard = $("endcard"), resetBtn = $("reset");

// ====== Настройки игры (можно менять!) ======
const PX_PER_M = 0.22;        // масштаб карты: пикселей на метр (больше - ближе)
const TIME_SCALE = 15;        // ускорение времени: во столько раз быстрее реальности едет машина
const KMH = [70, 50, 40, 30, 25, 15]; // скорость по типам дорог: магистраль, главная, средняя, обычная, жилая улица, двор (км/ч)
const BASE_FARE = 100, PER_KM = 20;     // цена: посадка + рубли за километр
const PICK_MIN = 800, PICK_MAX = 4500;  // как далеко от машины появляется клиент (метры)
const TRIP_MIN = 2000, TRIP_MAX = 16000; // длина поездки (метры по прямой)
const ORDER_TTL = 25, MAX_ORDERS = 3;
const SOFT_PICK = 20, SOFT_TRIP = 40, SOFT_KEEP = 0.3;   // длинные поездки сжимаются: всё, что дольше этих секунд, идёт в 3 раза быстрее
const SHIFT_LEN = 12 * 3600, DAY_START = 8 * 60;      // смена 12 игровых часов, начинается в 08:00
const LATE_SHARE = 0.10, LATE_MAX = 10;                // 10% пассажиров (с рейтингом ниже 4.85) опаздывают, но не больше чем на 10 с
const FREE_WAIT = 10, WAIT_RATE = 5;                     // остановка по просьбе: бесплатно 10 с, потом 5 ₽ за секунду
const REFUSE_AT = -3, AFF_MIN = -6, AFF_MAX = 10;
const GOAL = 5000;
const SAVE_KEY = "taxi-game-save-v1";

// ====== Граф дорог: из каждой точки список дорог, по которым можно ехать ======
const adj = N.map(() => []), nameOf = new Array(N.length).fill(-1);
for (const [a, b, c, ow, nm] of D.edges) {
  const len = Math.hypot(N[a][0] - N[b][0], N[a][1] - N[b][1]), t = len / (KMH[c] / 3.6);
  adj[a].push({ to: b, len, t, c });
  if (!ow) adj[b].push({ to: a, len, t, c });   // ow = улица с односторонним движением
  if (nm >= 0) { if (nameOf[a] < 0) nameOf[a] = nm; if (nameOf[b] < 0) nameOf[b] = nm; }
}

// ====== Поиск самого быстрого пути (алгоритм A*, быстрый на большом городе) ======
function push(h, x) { h.push(x); let i = h.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (h[p][0] <= h[i][0]) break; [h[p], h[i]] = [h[i], h[p]]; i = p; } }
function pop(h) {
  const top = h[0], last = h.pop();
  if (h.length) { h[0] = last; let i = 0; for (;;) { const a = 2 * i + 1, b = a + 1; let m = i;
    if (a < h.length && h[a][0] < h[m][0]) m = a; if (b < h.length && h[b][0] < h[m][0]) m = b;
    if (m === i) break; [h[m], h[i]] = [h[i], h[m]]; i = m; } }
  return top;
}
const VMAX = KMH[0] / 3.6;
function findPath(s, e) {
  const dist = new Float64Array(N.length).fill(Infinity), prev = new Array(N.length).fill(null), heap = [[0, s, 0]];
  dist[s] = 0;
  while (heap.length) {
    const [, u, g] = pop(heap);
    if (u === e) break;
    if (g > dist[u]) continue;
    for (const ed of adj[u]) {
      const nd = dist[u] + ed.t;
      if (nd < dist[ed.to]) {
        dist[ed.to] = nd; prev[ed.to] = { from: u, ed };
        push(heap, [nd + Math.hypot(N[ed.to][0] - N[e][0], N[ed.to][1] - N[e][1]) / VMAX, ed.to, nd]);
      }
    }
  }
  if (s !== e && !prev[e]) return null;
  const steps = []; let c = e;
  while (c !== s) { const p = prev[c]; steps.unshift({ n: c, c: p.ed.c, len: p.ed.len, t: p.ed.t }); c = p.from; }
  return steps;   // список шагов: куда едем, по какой дороге, сколько метров и секунд
}
function sumPath(st) { let km = 0, sec = 0; for (const s of st) { km += s.len / 1000; sec += s.t; } return { km, sec }; }

// ====== Где появляются заказы: рядом с известными местами (то есть в самом городе) ======
const hot = [];
for (let i = 0; i < N.length; i++) for (const p of D.places) if (nameOf[i] >= 0 && Math.abs(N[i][0] - p.x) < 1800 && Math.abs(N[i][1] - p.y) < 1800) { hot.push(i); break; }
function nearest(x, y) { let b = 0, bd = 1e18; for (let i = 0; i < N.length; i++) { const d = (N[i][0] - x) ** 2 + (N[i][1] - y) ** 2; if (d < bd) { bd = d; b = i; } } return b; }
function randHot(cx, cy, dmin, dmax) {
  const c = hot.filter(i => { const d = Math.hypot(N[i][0] - cx, N[i][1] - cy); return d >= dmin && d <= dmax; });
  const arr = c.length ? c : hot; return arr[Math.floor(Math.random() * arr.length)];
}
// Адрес: настоящее название улицы, номер дома придуман (но у одной точки он всегда один и тот же)
function addrOf(n) { return (nameOf[n] >= 0 ? D.names[nameOf[n]] : "Проезд") + ", " + ((n * 37) % 120 + 1); }
function destLabel(o) { return o.place ? o.place.n : addrOf(o.to); }

// ====== Состояние игры ======
let state = "idle", online = false, money = 0, ridesDone = 0, ratingSum = 25, ratingCount = 5;
const affection = {}, storyStep = {}, met = {}, seen = {};
let goalReached = false, endingShown = false, orders = [], nextOrderId = 1, previewId = null, current = null;
let lastRide = null, spawnTimer = 1.5, boardTimer = 0, dialogue = null, stopT = 0, stopDur = 0, legScale = TIME_SCALE;
let clock = 0, day = 1, shiftMoney = 0, shiftRides = 0, shiftOver = false, ff = 1, lastClk = "";   // clock - игровое время смены (секунды)
const floaters = [];
const xs = D.places.map(p => p.x).sort((a, b) => a - b), ys = D.places.map(p => p.y).sort((a, b) => a - b);
let carNode = nearest(xs[xs.length >> 1], ys[ys.length >> 1]);
const car = { x: N[carNode][0], y: N[carNode][1], angle: 0 };
let route = [];

function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ money, ridesDone, ratingSum, ratingCount, affection, storyStep, met, seen, goalReached, clock, day, shiftMoney, shiftRides, shiftOver })); } catch (e) {} }
function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); if (!d) return;
    money = d.money || 0; ridesDone = d.ridesDone || 0; ratingSum = d.ratingSum || 25; ratingCount = d.ratingCount || 5;
    Object.assign(affection, d.affection); Object.assign(storyStep, d.storyStep); Object.assign(met, d.met); Object.assign(seen, d.seen); goalReached = !!d.goalReached;
    clock = d.clock || 0; day = d.day || 1; shiftMoney = d.shiftMoney || 0; shiftRides = d.shiftRides || 0; shiftOver = !!d.shiftOver;
  } catch (e) {}
}
function resetGame() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); }
const getRating = () => ratingSum / ratingCount, getAff = n => affection[n] || 0;
function changeAff(n, d) { affection[n] = Math.max(AFF_MIN, Math.min(AFF_MAX, getAff(n) + d)); }
function ratingFactor() { const r = getRating(); return r >= 4.8 ? 0.7 : r < 4.3 ? 1.6 : 1; }

// ====== Заказы ======
function createOrder() {
  const story = PASSENGERS.filter(p => p.scenes && getAff(p.name) > REFUSE_AT && !orders.some(o => o.name === p.name));
  const p = story.length && Math.random() < 0.2 ? story[Math.floor(Math.random() * story.length)] : { name: NAMES[Math.floor(Math.random() * NAMES.length)] };
  const rating = STORY_RATING[p.name] || rollRating();
  const from = randHot(car.x, car.y, PICK_MIN, PICK_MAX);
  let to, place = null;
  if (Math.random() < 0.35) { place = D.places[Math.floor(Math.random() * D.places.length)]; to = place.node; }  // популярное место
  else to = randHot(N[from][0], N[from][1], TRIP_MIN, TRIP_MAX);
  if (to === from) return;
  const trip = findPath(from, to), pick = findPath(carNode, from);
  if (!trip || !pick) return;
  const st = sumPath(trip), sp = sumPath(pick);
  orders.push({ id: nextOrderId++, passenger: p, name: p.name, rating: rating.toFixed(2), runner: Math.random() < runnerChance(rating), late: rating > 4.85 || Math.random() >= LATE_SHARE ? 0 : 3 + Math.random() * (LATE_MAX - 3), from, to, place,
    tripKm: st.km, pickupKm: sp.km, pickupMin: Math.max(1, Math.round(sp.sec / 60)),
    price: Math.round((BASE_FARE + st.km * PER_KM) / 10) * 10, tip: 0, mood: 0, ttl: ORDER_TTL });
  renderPanel();
}
function acceptOrder(id) {
  const o = orders.find(x => x.id === id); if (!o || state !== "idle") return;
  current = o; current.tip = 0; current.mood = 0; orders = []; previewId = null; lastRide = null;
  startLeg(o.from, "toPickup");
}
function declineOrder(id) { orders = orders.filter(x => x.id !== id); if (previewId === id) previewId = null; renderPanel(); }
function legSpeed(steps, soft) {   // во сколько раз ускорить время на этом отрезке, чтобы он не тянулся слишком долго
  let sec = 0; for (const s of steps) sec += s.t;
  const g = sec / TIME_SCALE, eff = g > soft ? soft + (g - soft) * SOFT_KEEP : g;
  return eff > 0 ? sec / eff : TIME_SCALE;
}
function startLeg(target, newState) { route = findPath(carNode, target) || []; legScale = legSpeed(route, newState === "toPickup" ? SOFT_PICK : SOFT_TRIP); state = newState; renderPanel(); }

// ====== Диалоги ======
function pickScene(o, later) {
  const p = o.passenger, aff = getAff(p.name);
  if (p.scenes && !later) {   // личная история, если пассажир к вам расположен
    const step = storyStep[p.name] || 0;
    if (step < p.scenes.length) {
      const id = p.scenes[step], need = SCENES[id].minLike === undefined ? -99 : SCENES[id].minLike;
      if (aff >= need) { storyStep[p.name] = step + 1; return id; }
    }
    if (aff < 0) return COLD[0];
  }
  const r = +o.rating, conflict = r < 4.6 && Math.random() < 0.4;   // чем ниже рейтинг пассажира, тем сложнее поездка
  if (conflict) o.conflict = true;
  return fresh(r > 4.85 ? QUIET : conflict ? CONFLICTS : later ? CHAT : REQUESTS);
}
function fresh(pool) {   // диалог, который ещё не встречался; когда все пройдены, круг начинается заново
  let left = pool.filter(id => !seen[id]);
  if (!left.length) { pool.forEach(id => delete seen[id]); left = pool; }
  const id = left[Math.floor(Math.random() * left.length)]; seen[id] = 1; return id;
}
function startDialogue(o, later) { const sc = SCENES[pickScene(o, later)]; if (o.passenger.scenes) met[o.name] = true; dialogue = { scene: sc, nodeId: sc.start }; }
function chooseAnswer(i) {
  if (!dialogue) return;
  const ch = dialogue.scene.nodes[dialogue.nodeId].choices[i]; if (!ch) return;
  const like = ch.like || 0; current.tip += ch.tip || 0; current.mood += like; changeAff(current.name, like);
  if (ch.pay !== undefined) current.payMult = ch.pay;      // pay: доля оплаты (0 = не заплатит)
  if (ch.stars !== undefined) current.stars = ch.stars;    // оценка пассажира (0 = не оценит)
  if (ch.stop) current.stopNow = ch.stop;                     // stop: после разговора машина остановится
  let next = ch.next;
  if (ch.roll) next = Math.random() < ch.roll[0] ? ch.roll[1] : ch.roll[2];   // roll: [шанс, если повезло, если нет]
  if (ch.end) { dialogue = null; return endRide(ch.end); }                    // end: высадить пассажира
  if (!next || !dialogue.scene.nodes[next]) { dialogue = null; if (current.arrived) return finishRide(); if (current.stopNow) return startDetour(current.stopNow); }
  else dialogue.nodeId = next;
  renderPanel();
}
function arrive() {
  if (state === "toPickup") { state = "boarding"; boardTimer = 1.2 + current.late; renderPanel(); }
  else if (state === "toStop") { state = "stopped"; stopT = 0; stopDur = 14 + Math.random() * 16; renderPanel(); }
  else if (state === "toDropoff") {
    if (current.runner && !current.arrived) {   // пассажир, который не платит: сцена в конце поездки
      current.arrived = true; const sc = SCENES[fresh(RUNNERS)]; dialogue = { scene: sc, nodeId: sc.start }; renderPanel();
    } else finishRide();
  }

// ====== Обновление игры (каждый кадр) ======
function update(dt) {

  if (!shiftOver && clock >= SHIFT_LEN) shiftOver = true;
  tickClock();
  if (dialogue || endingShown) return;
  if (state === "idle") {
    if (shiftOver) return endShift();
    if (!online) return;
    clock += dt * TIME_SCALE;
    let changed = false;
    for (let i = orders.length - 1; i >= 0; i--) {
      orders[i].ttl -= dt;
      if (orders[i].ttl <= 0) { if (orders[i].id === previewId) previewId = null; orders.splice(i, 1); changed = true; }
    }
    spawnTimer -= dt;
    if (spawnTimer <= 0) { if (orders.length < MAX_ORDERS) createOrder(); spawnTimer = (6 + Math.random() * 6) * ratingFactor(); }
    if (changed) renderPanel();
    for (const o of orders) { const bar = $("bar-" + o.id); if (bar) bar.style.width = (o.ttl / ORDER_TTL * 100) + "%"; }
  } else if (state === "boarding") {

      const n = r > 4.85 ? 1 : Math.max(2, Math.min(4, Math.round(g / 14)));         // спокойные молчат, остальные говорят минимум дважды
      current.talkAt = Array.from({ length: n }, (_, i) => i / n * 0.85); /* разговоры равномерно по ходу поездки */ current.talkIdx = 1; startDialogue(current); renderPanel();

// ====== Рисование ======
const FILL = ["#f5b042", "#ffe08a", "#ffffff", "#ffffff", "#ffffff", "#faf8f3"], EDGE = ["#c98a1c", "#d9b64a", "#cfc9bb", "#d9d4c7", "#e0dbcf", "#e6e1d6"], WPX = [7, 6, 4.5, 3.5, 3, 2];   // 6 типов дорог

  ctx.font = "11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  // Подписи без наложений: каждая занимает прямоугольник, и новая не ставится, если пересекает уже занятое
  const vp = D.places.filter(p => p.x > vx && p.x < vx + viewW && p.y > vy && p.y < vy + viewH), placed = [], used = new Set();
  const free = (x, y, w, h) => { if (x - w / 2 < 6 || x + w / 2 > cw - 6 || y < 96) return false;   // не у краёв и не под верхними плашками
    return !placed.some(r => x - w / 2 < r[0] + r[2] && x + w / 2 > r[0] && y - h / 2 < r[1] + r[3] && y + h / 2 > r[1]); };

  take(sx(car.x), sy(car.y), 70, 50);   // машину подписями не закрываем
  ctx.font = "bold 11px sans-serif";
  const pl = vp.length <= 14 ? vp : [];
  for (const p of pl) take(sx(p.x), sy(p.y) + 14, ctx.measureText(p.n).width + 8, 14);   // места подписываем в первую очередь
  ctx.font = "11px sans-serif";
  for (const c of [0, 1, 2, 3, 4]) for (const e of vis[c]) {   // названия улиц, важные дороги первыми
    if (e[4] < 0 || used.size > 70) continue;
    const a = N[e[0]], b = N[e[1]], name = D.names[e[4]];

    ctx.save(); ctx.translate(mx, my); ctx.rotate(ang); ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.strokeText(name, 0, 0);
    ctx.fillStyle = "#555"; ctx.fillText(name, 0, 0); ctx.restore();
  }
  for (const p of vp) { const x = sx(p.x), y = sy(p.y); ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fillStyle = "#6f7f96"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke(); }
  if (pl.length) for (const p of pl) {
    ctx.font = "bold 11px sans-serif"; ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.strokeText(p.n, sx(p.x), sy(p.y) + 14); ctx.fillStyle = "#333"; ctx.fillText(p.n, sx(p.x), sy(p.y) + 14);
  }
  let A = null, B = null, S = null;   // метки: A - где забрать клиента, B - куда его везти (видна только в пути)
  if (state === "idle") { const o = orders.find(x => x.id === previewId); if (o) A = o.from; }
  else if (state === "toPickup" || state === "boarding") A = current.from; else if (state === "toDropoff") B = current.to; else if (state === "toStop" || state === "stopped") { B = current.to; S = current.stopNode; }
  if (A !== null) pin(sx(N[A][0]), sy(N[A][1]), "#2fa84f", "A");
  if (B !== null) pin(sx(N[B][0]), sy(N[B][1]), "#e5484d", "B");
  if (S !== null) pin(sx(N[S][0]), sy(N[S][1]), "#f08a1c", "С");
  ctx.save(); ctx.translate(sx(car.x), sy(car.y)); ctx.rotate(car.angle);   // машина
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(-12, -5, 25, 14); ctx.fillStyle = online ? "#f5c518" : "#9aa3b2"; ctx.fillRect(-12, -7, 24, 14);
  ctx.lineWidth = 1.5; ctx.strokeStyle = "#333"; ctx.strokeRect(-12, -7, 24, 14); ctx.fillStyle = "#35465a"; ctx.fillRect(3, -5, 5, 10); ctx.fillStyle = "#333"; ctx.fillRect(-7, -2, 6, 4); ctx.restore();
  ctx.font = "bold 20px sans-serif";
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, 1 - f.age / 1.4); const x = clamp(sx(f.x), 70, cw - 70), y = sy(f.y) + f.dy - f.age * 30;
    ctx.lineWidth = 4; ctx.strokeStyle = "#fff"; ctx.strokeText(f.text, x, y); ctx.fillStyle = f.color; ctx.fillText(f.text, x, y);
  }
  ctx.globalAlpha = 1;
}

let lastTime = 0;
function frame(time) { const dt = Math.min((time - lastTime) / 1000, 0.05); lastTime = time; update(dt); updateCamera(dt, false); draw(); requestAnimationFrame(frame); }
loadGame(); updateTop(); renderPanel(); resize(); requestAnimationFrame(frame);
</script>
