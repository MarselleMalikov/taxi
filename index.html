<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">

<style>
:root{--g:#22b455;--o:#f08a1c;--b:#2f6fed;--r:#e5484d;--ink:#1b1d22;--m:#6b7280;--c:#f3f4f6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0f1218;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
button{font-family:inherit}
#app{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#f0f1f4}

#recenter[hidden]{display:none}
#map{touch-action:none;cursor:grab}#map.drag{cursor:grabbing}

</style></head>
<body>
<div id="app">
  <canvas id="map"></canvas>
  <div id="topbar">
    <div class="pill" id="earn"><div class="money" id="money">0 ₽</div><div class="sub" id="goaltext"></div><div class="gbar"><i id="goalfill"></i></div></div>
    <div class="pill status off" id="statuspill"><span class="dot"></span><span><span id="statustext">Не на линии</span><div class="sub" id="clock"></div></span></div>
    <div class="pill" id="ratingpill"><div id="rating">★ 5.00</div><div class="sub" id="rides">поездок 0</div></div>
  </div>
  <div id="osm">© участники OpenStreetMap</div>

  <button id="recenter" hidden title="Вернуться к машине" aria-label="Вернуться к машине"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  <div id="sheet"><span class="grab"></span><div id="panel"></div><button id="shift" class="off"></button>
    <div id="sheetfoot"><button id="reset">Сбросить прогресс</button></div></div>
</div>

<script>
// ====== Карта: дороги Уфы из mapdata.js (координаты в метрах) ======
const D = MAPDATA, N = D.nodes, W = D.w, H = D.h, $ = id => document.getElementById(id);
const appEl = $("app"), canvas = $("map"), ctx = canvas.getContext("2d"), panel = $("panel");
const moneyEl = $("money"), ridesEl = $("rides"), ratingEl = $("rating"), shiftBtn = $("shift"), footEl = $("sheetfoot");
const goalFill = $("goalfill"), goalText = $("goaltext"), statusPill = $("statuspill"), statusText = $("statustext");
const endingEl = $("ending"), endCard = $("endcard"), resetBtn = $("reset");

// ====== Настройки игры (можно менять!) ======
const PX_PER_M = 0.22;        // масштаб карты: пикселей на метр (больше - ближе)
const TIME_SCALE = 15;        // ускорение времени: во столько раз быстрее реальности едет машина
const KMH = [70, 50, 40, 30, 25, 15]; // скорость по типам дорог: магистраль, главная, средняя, обычная, жилая улица, двор (км/ч)
const BASE_FARE = 100, PER_KM = 20;     // цена: посадка + рубли за километр
const PICK_MIN = 800, PICK_MAX = 4500;  // как далеко от машины появляется клиент (метры)
const TRIP_MIN = 2000, TRIP_MAX = 16000; // длина поездки (метры по прямой)
const ORDER_TTL = 25, MAX_ORDERS = 3;
const SOFT_PICK = 20, SOFT_TRIP = 40, SOFT_KEEP = 0.3;   // длинные поездки сжимаются: всё, что дольше этих секунд, идёт в 3 раза быстрее
const SHIFT_LEN = 12 * 3600, DAY_START = 8 * 60;      // смена 12 игровых часов, начинается в 08:00
const LATE_SHARE = 0.10, LATE_MAX = 10;                // 10% пассажиров (с рейтингом ниже 4.85) опаздывают, но не больше чем на 10 с
const FREE_WAIT = 10, WAIT_RATE = 5;                     // остановка по просьбе: бесплатно 10 с, потом 5 ₽ за секунду
const REFUSE_AT = -3, AFF_MIN = -6, AFF_MAX = 10;
const GOAL = 5000;
const SAVE_KEY = "taxi-game-save-v1";

// ====== Граф дорог: из каждой точки список дорог, по которым можно ехать ======
const adj = N.map(() => []), nameOf = new Array(N.length).fill(-1);
for (const [a, b, c, ow, nm] of D.edges) {
  const len = Math.hypot(N[a][0] - N[b][0], N[a][1] - N[b][1]), t = len / (KMH[c] / 3.6);
  adj[a].push({ to: b, len, t, c });
  if (!ow) adj[b].push({ to: a, len, t, c });   // ow = улица с односторонним движением
  if (nm >= 0) { if (nameOf[a] < 0) nameOf[a] = nm; if (nameOf[b] < 0) nameOf[b] = nm; }
}

// ====== Поиск самого быстрого пути (алгоритм A*, быстрый на большом городе) ======
function push(h, x) { h.push(x); let i = h.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (h[p][0] <= h[i][0]) break; [h[p], h[i]] = [h[i], h[p]]; i = p; } }
function pop(h) {
  const top = h[0], last = h.pop();
  if (h.length) { h[0] = last; let i = 0; for (;;) { const a = 2 * i + 1, b = a + 1; let m = i;
    if (a < h.length && h[a][0] < h[m][0]) m = a; if (b < h.length && h[b][0] < h[m][0]) m = b;
    if (m === i) break; [h[m], h[i]] = [h[i], h[m]]; i = m; } }
  return top;
}
const VMAX = KMH[0] / 3.6;
function findPath(s, e) {
  const dist = new Float64Array(N.length).fill(Infinity), prev = new Array(N.length).fill(null), heap = [[0, s, 0]];
  dist[s] = 0;
  while (heap.length) {
    const [, u, g] = pop(heap);
    if (u === e) break;
    if (g > dist[u]) continue;
    for (const ed of adj[u]) {
      const nd = dist[u] + ed.t;
      if (nd < dist[ed.to]) {
        dist[ed.to] = nd; prev[ed.to] = { from: u, ed };
        push(heap, [nd + Math.hypot(N[ed.to][0] - N[e][0], N[ed.to][1] - N[e][1]) / VMAX, ed.to, nd]);
      }
    }
  }
  if (s !== e && !prev[e]) return null;
  const steps = []; let c = e;
  while (c !== s) { const p = prev[c]; steps.unshift({ n: c, c: p.ed.c, len: p.ed.len, t: p.ed.t }); c = p.from; }
  return steps;   // список шагов: куда едем, по какой дороге, сколько метров и секунд
}
function sumPath(st) { let km = 0, sec = 0; for (const s of st) { km += s.len / 1000; sec += s.t; } return { km, sec }; }

// ====== Где появляются заказы: рядом с известными местами (то есть в самом городе) ======
// ====== Где появляются заказы ======
// Клиенты живут и работают в настоящих домах, а ездят часто в настоящие места: ТЦ, вокзалы, больницы, вузы, кафе.
// Каждую точку привязываем к ближайшему перекрёстку на улице с названием - туда и подъезжает машина.
const NCELL = 250, NCOLS = Math.ceil(W / NCELL), nodeGrid = new Map();
for (let i = 0; i < N.length; i++) if (nameOf[i] >= 0) { const k = Math.floor(N[i][1] / NCELL) * NCOLS + Math.floor(N[i][0] / NCELL); if (!nodeGrid.has(k)) nodeGrid.set(k, []); nodeGrid.get(k).push(i); }
function nodeNear(x, y) {   // ближайший узел дороги с названием (ищем по соседним клеткам)
  const cx = Math.floor(x / NCELL), cy = Math.floor(y / NCELL);
  for (let r = 0; r <= 6; r++) {
    let b = -1, bd = 1e18;
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const list = nodeGrid.get((cy + dy) * NCOLS + cx + dx); if (!list) continue;
      for (const n of list) { const d = (N[n][0] - x) ** 2 + (N[n][1] - y) ** 2; if (d < bd) { bd = d; b = n; } }
    }
    if (b >= 0) return b;
  }
  return nearest(x, y);
}
const HOMES = [];   // центры жилых и прочих домов площадью побольше (сараи и гаражи не берём)
if (typeof OSM !== "undefined") for (const b of OSM.buildings) {
  const r = typeof b[0] === "number" ? b : b[0]; let x = 0, y = 0, x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < r.length; i += 2) { x += r[i]; y += r[i + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if ((x1 - x0) * (y1 - y0) >= 150) HOMES.push([(x0 + x1) / 2, (y0 + y1) / 2]);
}
// Куда чаще ездят: вес категории места
const TRIP_WEIGHT = { airport: 5, station: 5, bus_station: 4, mall: 6, hospital: 3, university: 3, culture: 2, museum: 1.5, stadium: 2, sport: 1.5, park: 1.5,
  hotel: 2, food: 2, cafe: 1.5, shop: 1.5, school: 0.8, bank: 0.5, pharmacy: 0.5, fuel: 0.2 };
const TRIP_PLACES = [], TRIP_CUM = [];
for (const p of D.places.map(p => ({ n: p.n, k: p.k, x: p.x, y: p.y })).concat(typeof OSM !== "undefined" ? OSM.pois.map(p => ({ x: p[0], y: p[1], k: p[2], n: p[3] })) : [])) {
  const w = TRIP_WEIGHT[p.k]; if (!w) continue;
  TRIP_PLACES.push(p); TRIP_CUM.push((TRIP_CUM.length ? TRIP_CUM[TRIP_CUM.length - 1] : 0) + w);
}
function pickWeightedPlace() { const r = Math.random() * TRIP_CUM[TRIP_CUM.length - 1]; let lo = 0, hi = TRIP_CUM.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (TRIP_CUM[m] < r) lo = m + 1; else hi = m; } return TRIP_PLACES[lo]; }
// Случайная точка на расстоянии dmin..dmax от (cx, cy): дом или (с шансом placeShare) популярное место
function randSpot(cx, cy, dmin, dmax, placeShare) {
  for (let t = 0; t < 300; t++) {
    const place = Math.random() < placeShare && TRIP_PLACES.length ? pickWeightedPlace() : null;
    const pt = place ? [place.x, place.y] : HOMES.length ? HOMES[Math.floor(Math.random() * HOMES.length)] : N[Math.floor(Math.random() * N.length)];
    const d = Math.hypot(pt[0] - cx, pt[1] - cy);
    if (d >= dmin && d <= dmax) return { node: nodeNear(pt[0], pt[1]), place: place ? { n: place.n, k: place.k } : null };
  }
  return { node: nodeNear(cx + (Math.random() - 0.5) * dmax, cy + (Math.random() - 0.5) * dmax), place: null };   // не нашли - любая улица рядом
}
// Ближайшее подходящее место для заезда по просьбе пассажира
const STOP_KIND = { "аптека": ["pharmacy"], "банкомат": ["bank"], "магазин": ["shop"], "цветочный магазин": ["shop", "mall"], "пункт выдачи": ["shop", "mall"] };
function stopSpot(label) {
  const kinds = STOP_KIND[label] || ["shop", "pharmacy", "cafe", "food"];
  let best = null, bd = 1e18;
  for (const p of TRIP_PLACES) {
    if (!kinds.includes(p.k)) continue;
    const d = Math.hypot(p.x - car.x, p.y - car.y);
    if (d > 400 && d < 2500 && d < bd * (0.6 + Math.random() * 0.8)) { bd = d; best = p; }   // ближайшее, но не всегда одно и то же
  }
  return best;
}
function nearest(x, y) { let b = 0, bd = 1e18; for (let i = 0; i < N.length; i++) { const d = (N[i][0] - x) ** 2 + (N[i][1] - y) ** 2; if (d < bd) { bd = d; b = i; } } return b; }
// Адрес: настоящее название улицы, номер дома придуман (но у одной точки он всегда один и тот же)
function addrOf(n) { return (nameOf[n] >= 0 ? D.names[nameOf[n]] : "Проезд") + ", " + ((n * 37) % 120 + 1); }
function destLabel(o) { return o.place ? o.place.n : addrOf(o.to); }

// ====== Состояние игры ======
let state = "idle", online = false, money = 0, ridesDone = 0, ratingSum = 25, ratingCount = 5;
const affection = {}, storyStep = {}, met = {}, seen = {};
let goalReached = false, endingShown = false, orders = [], nextOrderId = 1, previewId = null, current = null;
let lastRide = null, spawnTimer = 1.5, boardTimer = 0, dialogue = null, stopT = 0, stopDur = 0, legScale = TIME_SCALE;
let clock = 0, day = 1, shiftMoney = 0, shiftRides = 0, shiftOver = false, ff = 1, lastClk = "";   // clock - игровое время смены (секунды)
const floaters = [];
const xs = D.places.map(p => p.x).sort((a, b) => a - b), ys = D.places.map(p => p.y).sort((a, b) => a - b);
let carNode = nearest(xs[xs.length >> 1], ys[ys.length >> 1]);
const car = { x: N[carNode][0], y: N[carNode][1], angle: 0 };
let route = [];

function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ money, ridesDone, ratingSum, ratingCount, affection, storyStep, met, seen, goalReached, clock, day, shiftMoney, shiftRides, shiftOver })); } catch (e) {} }
function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); if (!d) return;
    money = d.money || 0; ridesDone = d.ridesDone || 0; ratingSum = d.ratingSum || 25; ratingCount = d.ratingCount || 5;
    Object.assign(affection, d.affection); Object.assign(storyStep, d.storyStep); Object.assign(met, d.met); Object.assign(seen, d.seen); goalReached = !!d.goalReached;

const getRating = () => ratingSum / ratingCount, getAff = n => affection[n] || 0;

// ====== Заказы ======
function createOrder() {
  const story = PASSENGERS.filter(p => p.scenes && getAff(p.name) > REFUSE_AT && !orders.some(o => o.name === p.name));
  const p = story.length && Math.random() < 0.2 ? story[Math.floor(Math.random() * story.length)] : { name: NAMES[Math.floor(Math.random() * NAMES.length)] };
  const rating = STORY_RATING[p.name] || rollRating();
  const A = randSpot(car.x, car.y, PICK_MIN, PICK_MAX, 0.2);                 // забирают чаще из дома, иногда из ТЦ, вокзала, кафе
  const B = randSpot(N[A.node][0], N[A.node][1], TRIP_MIN, TRIP_MAX, A.place ? 0.25 : 0.45);   // везут чаще в место, но и домой тоже
  const from = A.node, to = B.node, place = B.place, fromPlace = A.place;
  if (to === from) return;
  const trip = findPath(from, to), pick = findPath(carNode, from);
  if (!trip || !pick) return;
  const st = sumPath(trip), sp = sumPath(pick);
  orders.push({ id: nextOrderId++, passenger: p, name: p.name, fromPlace, rating: rating.toFixed(2), cash: Math.random() < 0.45, runner: false, late: rating > 4.85 || Math.random() >= LATE_SHARE ? 0 : 3 + Math.random() * (LATE_MAX - 3), from, to, place,
    tripKm: st.km, pickupKm: sp.km, pickupMin: Math.max(1, Math.round(sp.sec / 60)),
    price: Math.round((BASE_FARE + st.km * PER_KM) / 10) * 10, tip: 0, mood: 0, ttl: ORDER_TTL });
  const o = orders[orders.length - 1]; o.runner = o.cash && Math.random() < runnerChance(rating);   // не заплатить может только тот, кто платит наличными
  renderPanel();
}
function acceptOrder(id) {
  const o = orders.find(x => x.id === id); if (!o || state !== "idle") return;
  current = o; current.tip = 0; current.mood = 0; orders = []; previewId = null; lastRide = null; freeCam = false;
  startLeg(o.from, "toPickup");
}
function declineOrder(id) { orders = orders.filter(x => x.id !== id); if (previewId === id) previewId = null; renderPanel(); }
function legSpeed(steps, soft) {   // во сколько раз ускорить время на этом отрезке, чтобы он не тянулся слишком долго

}

// ====== Диалоги ======
function pickScene(o, later) {

    const step = storyStep[p.name] || 0;
    if (step < p.scenes.length) {
      const id = p.scenes[step], need = SCENES[id].minLike === undefined ? -99 : SCENES[id].minLike;
      if (aff >= need) { storyStep[p.name] = step + 1; return id; }
    }
    if (aff < 0) return COLD[0];
  }
  const r = +o.rating, conflict = r < 4.6 && Math.random() < 0.4;   // чем ниже рейтинг пассажира, тем сложнее поездка
  if (conflict) o.conflict = true;

}
function fresh(pool) {   // диалог, который ещё не встречался; когда все пройдены, круг начинается заново
  let left = pool.filter(id => !seen[id]);
  if (!left.length) { pool.forEach(id => delete seen[id]); left = pool; }
  const id = left[Math.floor(Math.random() * left.length)]; seen[id] = 1; return id;
}
function startDialogue(o, later) { const sc = SCENES[pickScene(o, later)]; if (o.passenger.scenes) met[o.name] = true; dialogue = { scene: sc, nodeId: sc.start }; }
function chooseAnswer(i) {
  if (!dialogue) return;
  const ch = dialogue.scene.nodes[dialogue.nodeId].choices[i]; if (!ch) return;
  const like = ch.like || 0; current.tip += ch.tip || 0; current.mood += like; changeAff(current.name, like);
  if (ch.pay !== undefined) current.payMult = ch.pay;      // pay: доля оплаты (0 = не заплатит)
  if (ch.stars !== undefined) current.stars = ch.stars;    // оценка пассажира (0 = не оценит)
  if (ch.stop) current.stopNow = ch.stop;                     // stop: после разговора машина остановится
  let next = ch.next;
  if (ch.roll) next = Math.random() < ch.roll[0] ? ch.roll[1] : ch.roll[2];   // roll: [шанс, если повезло, если нет]
  if (ch.end) { dialogue = null; return endRide(ch.end); }                    // end: высадить пассажира

    } else finishRide();

function startDetour(label) {   // пассажир попросил заехать: едем в ближайшее место, ждём, потом дальше

  const sn = spot ? nodeNear(spot.x, spot.y) : nodeNear(car.x + Math.cos(a) * 900, car.y + Math.sin(a) * 900), there = findPath(carNode, sn), back = findPath(sn, current.to);

  const extra = Math.max(0, sumPath(there).km + sumPath(back).km - remainingLen() / 1000);   // крюк оплачивается по километражу
  current.extraFare = (current.extraFare || 0) + Math.round(extra * PER_KM / 10) * 10;

}
function remainingLen() {

}

function kickOut() {

}

  const fare = Math.round((c.price * part + (c.waitFee || 0) + (c.extraFare || 0)) * mult / 10) * 10, tip = mult > 0 ? c.tip : 0;

  money += fare + tip; ridesDone++; shiftMoney += fare + tip; shiftRides++;
  if (fare > 0) floaters.push({ text: "+" + fare + " ₽", x: car.x, y: car.y, age: 0, color: "#1f8a3a", dy: -20 });
  if (tip > 0) floaters.push({ text: "+" + tip + " ₽ чаевые", x: car.x, y: car.y, age: 0, color: "#b8860b", dy: 6 });
  lastRide = { name: c.name, cash: c.cash, price: fare, tip, stars, mood: c.mood, note: reason || (mult === 0 ? "Пассажир не заплатил" : ""), wait: mult > 0 ? (c.waitFee || 0) + (c.extraFare || 0) : 0, blocked: getAff(c.name) <= REFUSE_AT };

// ====== Финал ======
function endShift() {
  endingShown = true; online = false; orders = []; previewId = null;
  endCard.innerHTML = '<h2>Смена ' + day + ' окончена</h2><div class="title">' + SHIFT_LEN / 3600 + ' часов за рулём</div><div class="line">Заработано за смену: ' + shiftMoney.toLocaleString("ru-RU") +
    ' ₽</div><div class="line">Поездок: ' + shiftRides + '</div><div class="line">Рейтинг: ★ ' + getRating().toFixed(2) + '</div><div class="line">Всего накоплено: ' + money.toLocaleString("ru-RU") +
    ' ₽</div><button class="endbtn main" data-end="newshift">Начать новую смену</button>';
  endingEl.hidden = false; saveGame(); renderPanel();
}
function tickClock() {
  const m = Math.floor(clock / 60) + DAY_START, txt = String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0") + " · смена " + day;
  if (txt !== lastClk) { lastClk = txt; $("clock").textContent = txt; }
}
function showEnding() {
  endingShown = true;
  const r = getRating(); let title = "Просто таксист"; if (r >= 4.3) title = "Надёжный водитель"; if (r >= 4.8) title = "Лучший таксист города";
  let html = '<h2>Цель достигнута!</h2><div class="title">' + title + '</div><div class="line">Накоплено: ' + money.toLocaleString("ru-RU") +
    ' ₽</div><div class="line">Поездок: ' + ridesDone + '</div><div class="line">Рейтинг: ★ ' + r.toFixed(2) + '</div><div class="sect">Истории пассажиров</div>';
  let any = false;
  let storyNo = 0;
  for (const p of PASSENGERS) if (p.scenes && met[p.name]) {
    const a = getAff(p.name); let mood = a <= REFUSE_AT ? "больше не ездит с тобой" : a < 0 ? "обида" : a >= 2 ? "добрые отношения" : "знакомые";
    html += '<div class="line">История ' + (++storyNo) + ": глав " + (storyStep[p.name] || 0) + " из " + p.scenes.length + ", " + mood + "</div>"; any = true;
  }
  if (!any) html += '<div class="line">Ты ещё не узнал ничьих историй.</div>';
  endCard.innerHTML = html + '<button class="endbtn main" data-end="continue">Играть дальше</button><button class="endbtn" data-end="restart">Начать заново</button>';
  endingEl.hidden = false;
}
endCard.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.end === "continue") { endingEl.hidden = true; endingShown = false; updateTop(); } else if (b.dataset.end === "restart") resetGame();
  else if (b.dataset.end === "newshift") { clock = 0; day++; shiftOver = false; shiftMoney = 0; shiftRides = 0; endingShown = false; endingEl.hidden = true; saveGame(); updateTop(); renderPanel(); }
});
resetBtn.addEventListener("click", () => { if (confirm("Точно сбросить весь прогресс? Это нельзя отменить.")) resetGame(); });

// ====== Обновление игры (каждый кадр) ======
function update(dt) {
  for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].age += dt; if (floaters[i].age > 1.4) floaters.splice(i, 1); }
  if (!shiftOver && clock >= SHIFT_LEN) shiftOver = true;
  tickClock();
  if (dialogue || endingShown) return;
  if (state === "idle") {
    if (shiftOver) return endShift();
    if (!online) return;
    clock += dt * TIME_SCALE;
    let changed = false;
    for (let i = orders.length - 1; i >= 0; i--) {
      orders[i].ttl -= dt;
      if (orders[i].ttl <= 0) { if (orders[i].id === previewId) previewId = null; orders.splice(i, 1); changed = true; }
    }
    spawnTimer -= dt;
    if (spawnTimer <= 0) { if (orders.length < MAX_ORDERS) createOrder(); spawnTimer = (6 + Math.random() * 6) * ratingFactor(); }
    if (changed) renderPanel();
    for (const o of orders) { const bar = $("bar-" + o.id); if (bar) bar.style.width = (o.ttl / ORDER_TTL * 100) + "%"; }
  } else if (state === "boarding") {
    boardTimer -= dt; clock += dt * TIME_SCALE;
    if (boardTimer <= 0) {
      startLeg(current.to, "toDropoff"); current.rideLen = remainingLen();
      const r = +current.rating, g = route.reduce((a, s) => a + s.t, 0) / legScale;   // длительность поездки в секундах игры
      const n = r > 4.85 ? 1 : Math.max(2, Math.min(4, Math.round(g / 14)));         // спокойные молчат, остальные говорят минимум дважды
      current.talkAt = Array.from({ length: n }, (_, i) => i / n * 0.85); /* разговоры равномерно по ходу поездки */ current.talkIdx = 1; startDialogue(current); renderPanel();
    }

    stopT += dt; clock += dt * TIME_SCALE;

    if (w) w.textContent = stopT < FREE_WAIT ? "Бесплатное ожидание: ещё " + Math.ceil(FREE_WAIT - stopT) + " с" : "Платное ожидание: +" + fee + " ₽";
    if (stopT >= stopDur) { current.waitFee = (current.waitFee || 0) + fee; startLeg(current.to, "toDropoff"); current.rideLen = remainingLen(); }
  } else {
    if (state === "toDropoff" && current.talkIdx < current.talkAt.length && 1 - remainingLen() / current.rideLen >= current.talkAt[current.talkIdx]) {

    }

    while (t > 0 && route.length) {

// ====== Камера ======
let scale = PX_PER_M, cw = 400, ch = 800, viewW = 400, viewH = 800, camX = car.x, camY = car.y;
const dpr = window.devicePixelRatio || 1;
function resize() {
  const r = appEl.getBoundingClientRect(); cw = r.width; ch = r.height;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr); if (typeof blayer !== "undefined") blayer.valid = false;
  viewW = cw / scale; viewH = ch / scale; updateCamera(0, true);
}
window.addEventListener("resize", resize);
function getFocus() {
  if (state === "idle" && previewId !== null) { const o = orders.find(x => x.id === previewId); if (o) return { x: N[o.from][0], y: N[o.from][1] }; }

}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
let freeCam = false, freeIdle = 0;   // freeCam - игрок сам двигает карту
const FREE_RETURN = 12;              // через сколько секунд без касаний камера сама вернётся к машине
function updateCamera(dt, snap) {
  if (freeCam) {
    camX = clamp(camX, viewW / 2, W - viewW / 2); camY = clamp(camY, viewH / 2, H - viewH / 2);
    if (!ptrs.size && (freeIdle += dt) > FREE_RETURN) freeCam = false; else return;
  }

  camY += (clamp(f.y + 0.17 * viewH, viewH / 2, H - viewH / 2) - camY) * k;   // машина в верхней трети экрана
}

// Масштаб: колесо мыши, два пальца или кнопки + и -
const ZOOM_MAX = 1.6;                                           // пикселей на метр при максимальном приближении
const zoomMin = () => Math.max(0.035, cw / W, ch / H);          // дальше отдалять нельзя: вся карта уже на экране
let zoomUntil = 0;                                              // пока идёт масштабирование, слой карты не перерисовываем каждый кадр
function setZoom(ns, ax = cw / 2, ay = ch / 2) {                // ax, ay - точка экрана, которая остаётся на месте
  ns = clamp(ns, zoomMin(), ZOOM_MAX); if (ns === scale) return;
  if (freeCam) { const wx = camX + (ax - cw / 2) / scale, wy = camY + (ay - ch / 2) / scale; camX = wx - (ax - cw / 2) / ns; camY = wy - (ay - ch / 2) / ns; }
  scale = ns; viewW = cw / scale; viewH = ch / scale; zoomUntil = performance.now() + 180;
  if (!freeCam) updateCamera(0, true);

canvas.addEventListener("wheel", e => { e.preventDefault(); setZoom(scale * Math.exp(-e.deltaY * 0.0015), e.offsetX, e.offsetY); }, { passive: false });
$("zin").addEventListener("click", () => setZoom(scale * 1.6));
$("zout").addEventListener("click", () => setZoom(scale / 1.6));

// Перетаскивание карты одним пальцем или мышью, масштаб - двумя пальцами
const ptrs = new Map(); let drag = null, pinch = null;
const midDist = () => { const [a, b] = [...ptrs.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) }; };
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); canvas.classList.add("drag");
  if (ptrs.size === 2) { pinch = midDist(); drag = null; } else if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const rect = canvas.getBoundingClientRect();
  if (pinch && ptrs.size === 2) {
    const m = midDist(); freeCam = true; freeIdle = 0; $("recenter").hidden = false;
    camX -= (m.x - pinch.x) / scale; camY -= (m.y - pinch.y) / scale;           // двигаем вслед за пальцами
    if (pinch.d > 0) setZoom(scale * m.d / pinch.d, m.x - rect.left, m.y - rect.top);
    pinch = m; return;
  }

  if (!freeCam && Math.hypot(dx, dy) < 4) return;   // случайное касание не считаем
  freeCam = true; freeIdle = 0; camX -= dx / scale; camY -= dy / scale; drag.x = e.clientX; drag.y = e.clientY;
  $("recenter").hidden = false;
});
const endDrag = e => {
  ptrs.delete(e.pointerId); pinch = null;
  if (ptrs.size === 1) { const [q] = ptrs.values(); drag = { x: q.x, y: q.y }; } else { drag = null; canvas.classList.remove("drag"); }
};
canvas.addEventListener("pointerup", endDrag); canvas.addEventListener("pointercancel", endDrag);
$("recenter").addEventListener("click", () => { freeCam = false; $("recenter").hidden = true; });

// ====== Верхние плашки, кнопка, панель ======

  goalFill.style.width = Math.min(100, money / GOAL * 100) + "%";
  goalText.textContent = goalReached ? "цель достигнута ✓" : "цель " + GOAL.toLocaleString("ru-RU") + " ₽";
}
function updateStatus() {

  statusPill.className = "pill status " + cls; statusText.textContent = !idle ? "В заказе" : online ? "На линии" : "Не на линии";
  $("ff").hidden = !(state === "toPickup" || state === "toDropoff" || state === "toStop"); $("ff").textContent = "⏩ ×" + ff;

  shiftBtn.innerHTML = online ? "На линии<small>нажмите, чтобы закончить смену</small>" : "Катать<small>нажмите, чтобы выйти на линию</small>";
}
$("ff").addEventListener("click", () => { ff = ff === 1 ? 2 : ff === 2 ? 4 : 1; updateStatus(); });

// Склеиваем соседние участки одной улицы в длинные линии: на коротком участке название не помещается
const STREETS = (() => {
  const by = new Map();   // имя -> узел -> участки
  D.edges.forEach((e, i) => { if (e[4] < 0 || e[5] > 4) return; let m = by.get(e[4]); if (!m) by.set(e[4], m = new Map());

  const out = [], done = new Set();
  for (const [nm, m] of by) {
    const walk = start => {   // идём от узла, пока улица не разветвится
      for (const ei of m.get(start)) {
        if (done.has(ei)) continue;
        const pts = [start]; let cur = start, e = ei, cls = 9;
        while (e !== undefined && !done.has(e)) {
          done.add(e); const E = D.edges[e]; cls = Math.min(cls, E[5]); cur = E[0] === cur ? E[1] : E[0]; pts.push(cur);
          const nx = m.get(cur); e = nx.length === 2 ? nx.find(x => !done.has(x)) : undefined;

        if (pts.length > 1) {

          for (const [x, y] of xy) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
          out.push({ name: D.names[nm], cls, xy, x0, y0, x1, y1 });

    for (const n of m.keys()) walk(n);                           // остались только кольца

  }
  if (route.length && (state === "toPickup" || state === "toDropoff" || state === "toStop")) {
    ctx.beginPath(); ctx.moveTo(car.x, car.y); for (const s of route) ctx.lineTo(N[s.n][0], N[s.n][1]);
    ctx.strokeStyle = "rgba(47,111,237,.85)"; ctx.lineWidth = 6 / scale; ctx.stroke();
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // дальше рисуем в пикселях экрана: подписи, метки, машина
  ctx.font = "11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  // Подписи без наложений: каждая занимает прямоугольник, и новая не ставится, если пересекает уже занятое
  const placed = [], used = new Set();
  const free = (x, y, w, h) => { if (x - w / 2 < 6 || x + w / 2 > cw - 6 || y - h / 2 < 92) return false;   // не у краёв и не под верхними плашками
    return !placed.some(r => x - w / 2 < r[0] + r[2] && x + w / 2 > r[0] && y - h / 2 < r[1] + r[3] && y + h / 2 > r[1]); };
  const take = (x, y, w, h) => placed.push([x - w / 2, y - h / 2, w, h]);
  take(sx(car.x), sy(car.y), 70, 50);   // машину значками и подписями не закрываем
  // Места: идём от важных к мелким. Мелкое место показываем только вместе с подписью, иначе карта превращается в россыпь значков
  const shown = []; let labels = 0;
  const placePois = major => {
    ctx.font = "600 11px sans-serif";
    for (const p of POIS) {
      if (p.major !== major || p.x < vx || p.x > vx + viewW || p.y < vy || p.y > vy + viewH) continue;
      if (!major && (shown.length >= 22 || labels >= 14)) break;
      const far = scale < 0.12;   // издалека - только вокзалы, аэропорт, ТЦ, крупные больницы и вузы, и только с подписью
      if (far && ((PLACE_RANK[p.k] ?? 6) > 1 || labels >= 10)) continue;
      const x = sx(p.x), y = sy(p.y), r = major ? 19 : 17;
      if (!free(x, y, r + (major ? 0 : 16), r + (major ? 0 : 16))) continue;   // мелкие держим на расстоянии друг от друга
      const w = ctx.measureText(p.n).width;
      let side = labels < 14 && free(x + 12 + w / 2, y, w + 6, 16) ? 1 : labels < 14 && free(x - 12 - w / 2, y, w + 6, 16) ? -1 : 0;
      if (!side && (!major || far)) continue;
      take(x, y, r, r); if (side) { take(x + side * (12 + w / 2), y, w + 6, 16); labels++; }
      shown.push([p, x, y, side]);
    }
  };
  placePois(true);
  ctx.font = "11px sans-serif";
  let streetLabels = 0;
  for (const st of scale >= 0.12 ? STREETS : []) {   // ищем на улице почти прямой кусок нужной длины и пишем название вдоль него
    if (streetLabels > 40) break;
    if (st.x1 < vx || st.x0 > vx + viewW || st.y1 < vy || st.y0 > vy + viewH) continue;
    const w = ctx.measureText(st.name).width + 8, P = st.xy;
    for (let i = 0; i < P.length - 1; i++) {
      let len = 0, j = i;
      while (j < P.length - 1 && len < w) { len += Math.hypot(P[j + 1][0] - P[j][0], P[j + 1][1] - P[j][1]) * scale; j++; }
      if (len < w) break;
      const ax = sx(P[i][0]), ay = sy(P[i][1]), bx = sx(P[j][0]), by = sy(P[j][1]), cl = Math.hypot(bx - ax, by - ay);
      if (cl < w * 0.92) continue;   // кусок слишком изогнут
      let straight = true;
      for (let q = i + 1; q < j && straight; q++) { const px = sx(P[q][0]), py = sy(P[q][1]); if (Math.abs((bx - ax) * (ay - py) - (ax - px) * (by - ay)) / cl > 3) straight = false; }
      if (!straight) continue;
      const mx = (ax + bx) / 2, my = (ay + by) / 2, key = st.name + ":" + Math.round(mx / 260) + ":" + Math.round(my / 260);
      if (used.has(key)) continue;
      let ang = Math.atan2(by - ay, bx - ax); if (ang > Math.PI / 2 || ang < -Math.PI / 2) ang += Math.PI;
      const bw = Math.abs(w * Math.cos(ang)) + 14 * Math.abs(Math.sin(ang)), bh = Math.abs(w * Math.sin(ang)) + 14 * Math.abs(Math.cos(ang));
      if (!free(mx, my, bw, bh)) continue;
      take(mx, my, bw, bh); used.add(key); streetLabels++;
      ctx.save(); ctx.translate(mx, my); ctx.rotate(ang); ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.strokeText(st.name, 0, 0);
      ctx.fillStyle = "#5b6370"; ctx.fillText(st.name, 0, 0); ctx.restore();
      i = j;   // следующий кусок этой же улицы - дальше по линии
    }
  }
  if (scale >= 0.16) placePois(false);   // мелкие места - только вблизи
  for (const [p, x, y] of shown) placeIcon(x, y, p.k, p.major);
  ctx.font = "600 11px sans-serif"; ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,.92)";
  for (const [p, x, y, side] of shown) {   // подпись цветом категории, чуть темнее значка
    if (!side) continue;
    ctx.textAlign = side > 0 ? "left" : "right"; ctx.strokeText(p.n, x + side * 12, y);
    ctx.fillStyle = textColor((PLACE_STYLE[p.k] || PLACE_STYLE.other).col); ctx.fillText(p.n, x + side * 12, y);
  }
  ctx.textAlign = "center";
  let A = null, B = null, S = null;   // метки: A - где забрать клиента, B - куда его везти (видна только в пути)
  if (state === "idle") { const o = orders.find(x => x.id === previewId); if (o) A = o.from; }
  else if (state === "toPickup" || state === "boarding") A = current.from; else if (state === "toDropoff") B = current.to; else if (state === "toStop" || state === "stopped") { B = current.to; S = current.stopNode; }
  if (A !== null) pin(sx(N[A][0]), sy(N[A][1]), "#2fa84f", "A");
  if (B !== null) pin(sx(N[B][0]), sy(N[B][1]), "#e5484d", "B");
  if (S !== null) pin(sx(N[S][0]), sy(N[S][1]), "#f08a1c", "С");
  ctx.save(); ctx.translate(sx(car.x), sy(car.y)); ctx.rotate(car.angle);   // машина
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(-12, -5, 25, 14); ctx.fillStyle = online ? "#f5c518" : "#9aa3b2"; ctx.fillRect(-12, -7, 24, 14);
  ctx.lineWidth = 1.5; ctx.strokeStyle = "#333"; ctx.strokeRect(-12, -7, 24, 14); ctx.fillStyle = "#35465a"; ctx.fillRect(3, -5, 5, 10); ctx.fillStyle = "#333"; ctx.fillRect(-7, -2, 6, 4); ctx.restore();
  ctx.font = "bold 20px sans-serif";
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, 1 - f.age / 1.4); const x = clamp(sx(f.x), 70, cw - 70), y = sy(f.y) + f.dy - f.age * 30;
    ctx.lineWidth = 4; ctx.strokeStyle = "#fff"; ctx.strokeText(f.text, x, y); ctx.fillStyle = f.color; ctx.fillText(f.text, x, y);
  }
  ctx.globalAlpha = 1;
}

let lastTime = 0;
function frame(time) { const dt = Math.min((time - lastTime) / 1000, 0.05); lastTime = time; update(dt); updateCamera(dt, false); if (!freeCam) $("recenter").hidden = true; draw(); requestAnimationFrame(frame); }
loadGame(); updateTop(); renderPanel(); resize(); requestAnimationFrame(frame);
</script>
</body></html>
