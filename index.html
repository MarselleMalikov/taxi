<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Такси-игра</title>
<style>
:root{--g:#22b455;--o:#f08a1c;--b:#2f6fed;--r:#e5484d;--ink:#1b1d22;--m:#6b7280;--c:#f3f4f6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0f1218;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
button{font-family:inherit}
#app{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#f0f1f4}
#map{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
#topbar{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;pointer-events:none}
.pill{background:rgba(255,255,255,.96);border-radius:14px;padding:7px 11px;box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:13px}
#menubtn{position:relative;pointer-events:auto;width:46px;flex:none;padding:0;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.burger{display:flex;flex-direction:column;gap:4px}.burger i{display:block;width:18px;height:2px;border-radius:1px;background:#2b313b}
#menubtn .dot{position:absolute;top:7px;right:7px;width:10px;height:10px;border:2px solid #fff;box-sizing:content-box}
#earn{min-width:96px;padding:7px 12px}
.money{font-size:17px;font-weight:700;color:#16883f;line-height:1.15}
#ratingpill{margin-left:auto}
#earn{pointer-events:auto;cursor:pointer}
#fuelpill{pointer-events:auto;border:none;display:flex;align-items:center;gap:6px;padding:7px 10px;color:#4b5563;cursor:pointer;font-family:inherit}
#fuelpill b{display:block;font-size:13px;color:var(--ink);line-height:1.2}
.fbar{display:block;width:34px;height:4px;border-radius:2px;background:#e1e4ea;margin-top:3px;overflow:hidden}.fbar i{display:block;height:100%;background:#4b5563}
#fuelpill.low{color:#c9363b}#fuelpill.low .fbar i{background:#e0474c}#fuelpill.low b{color:#c9363b}
.sub{font-size:11px;color:var(--m);margin-top:1px}
.gbar{height:4px;background:#e1e4ea;border-radius:2px;margin-top:5px;overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:var(--g);transition:width .4s}
.dot{width:9px;height:9px;border-radius:50%;background:#9aa3b2}
.status.on .dot{background:var(--g)}.status.ride .dot{background:var(--b)}
#ratingpill{text-align:center;white-space:nowrap}
#rating{font-size:16px;font-weight:700;color:#d98f00}
#osm{position:absolute;z-index:2;left:10px;top:calc(env(safe-area-inset-top,0px) + 68px);font-size:10px;color:#555;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:6px}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:60%;overflow-y:auto}
.grab{display:block;width:40px;height:4px;border-radius:2px;background:#d5d8df;margin:-8px auto 12px}
#ledger{position:fixed;inset:0;z-index:19;display:flex;align-items:center;justify-content:center;padding:16px}#ledger[hidden]{display:none}
.lrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eceef1;font-size:15px}.lrow span{color:var(--m)}
.lrow.minus b{color:#c9363b}.lrow.total{border-bottom:none;font-size:17px;padding-top:12px}.lrow.total span{color:var(--ink);font-weight:600}.lsub{font-size:13px;color:var(--m);margin-top:6px}
#ask{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}#ask[hidden]{display:none}
.askback{position:absolute;inset:0;background:rgba(15,18,24,.45)}
.askcard{position:relative;width:100%;max-width:340px;background:#fff;border-radius:18px;padding:18px 16px 14px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.askcard b{font-size:18px}.askcard p{margin:8px 0 16px;color:var(--m);font-size:15px;line-height:1.35}
.askbtns{display:flex;gap:8px}.askbtns button{flex:1;padding:12px;border:none;border-radius:12px;font-size:16px;cursor:pointer}
#askno{background:#eceef1;color:var(--ink)}#askok{background:var(--r);color:#fff;font-weight:700}
#pickbar{position:absolute;z-index:4;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 66px);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#5b3fd0;color:#fff;border-radius:14px;padding:10px 12px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25)}#pickbar[hidden]{display:none}
#pickbar button{border:none;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer}
.msect{display:flex;flex-direction:column;gap:6px}.msect b{font-size:16px}.msect small{color:var(--m);font-size:14px;line-height:1.3}
.mbtn{padding:11px;border:none;border-radius:12px;background:#ece8fb;color:#4a32b8;font-size:15px;font-weight:600;cursor:pointer}.mbtn:disabled{opacity:.5;cursor:default}
.bizchip{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding:9px 12px;border-radius:12px;background:#ece8fb;color:#4a32b8;font-size:14px;font-weight:600}
.bizchip button{border:none;background:#fff;color:#4a32b8;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;margin-left:4px}
#menu{position:absolute;inset:0;z-index:5}#menu[hidden]{display:none}
.mback{position:absolute;inset:0;background:rgba(15,18,24,.35)}
.mpanel{position:absolute;top:0;left:0;bottom:0;width:min(300px,82%);background:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:4px 0 24px rgba(0,0,0,.2)}
.mhead{display:flex;align-items:center;justify-content:space-between}.mhead b{font-size:20px}
.mhead .x{width:36px;height:36px;border:none;border-radius:50%;background:#f1f2f4;font-size:22px;line-height:1;color:#4b5563;cursor:pointer}
.mstatus{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
#shift{display:block;width:100%;margin-top:6px;padding:14px;border:none;border-radius:14px;font-size:20px;font-weight:700;color:#fff;cursor:pointer;transition:background .25s}
#shift small{display:block;margin-top:2px;font-size:12px;font-weight:400;opacity:.92}
#shift.off{background:var(--o)}#shift.on{background:var(--g)}
.mstats{display:flex;flex-direction:column;border-top:1px solid #eceef1}
.mstats div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eceef1;font-size:15px}.mstats span{color:var(--m)}
#reset{align-self:flex-start;border:none;background:none;padding:6px 0;color:var(--m);font-size:14px;text-decoration:underline;cursor:pointer}
.fuelgo{display:block;width:100%;margin-top:10px;padding:12px;border:none;border-radius:12px;background:#eceef1;font-size:16px;font-weight:600;cursor:pointer}
.offmsg{padding:6px 2px 8px}.offmsg b{display:block;font-size:18px}.offmsg small{color:var(--m);font-size:14px}
.search{display:flex;align-items:center;gap:14px;padding:8px 2px 10px}
.search b{display:block;font-size:17px}.search small{color:var(--m);font-size:13px}
.pulse{flex:none;position:relative;width:14px;height:14px;margin:0 6px;border-radius:50%;background:var(--g)}
.pulse::after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;background:var(--g);animation:ping 1.4s infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
.listhead{font-size:13px;color:var(--m);margin:0 2px 8px}
.ocard{background:var(--c);border-radius:14px;padding:12px;margin-bottom:10px;border:2px solid transparent;cursor:pointer}
.ocard.sel{border-color:var(--g);background:#fff}
.ocard.surge{background:#eef3ff}.ocard.surge.sel{border-color:#2f6fed;background:#fff}
.ocard.surge .obarfill{background:#2f6fed}.ocard.surge .obtns .take{background:#2f6fed}
.sbadge{font-size:13px;font-weight:700;color:#2456c9;background:#dfe8ff;padding:4px 9px;border-radius:999px}
.paychip.blue{background:#dfe8ff;color:#2456c9;margin-left:6px}
.otop{display:flex;justify-content:space-between;align-items:baseline}
.orate{font-size:14px;color:var(--m)}.orate.low{color:#c9363b;font-weight:700}.oprice{font-size:24px;font-weight:700}
.ohide{margin-top:8px;font-size:12px;color:var(--m)}
.obar{height:4px;background:#dfe2e8;border-radius:2px;margin-top:8px;overflow:hidden}
.obarfill{height:100%;width:100%;background:var(--g)}
.obtns{display:flex;gap:8px;margin-top:10px}
.obtns button{flex:1;padding:12px;font-size:16px;border:none;border-radius:12px;cursor:pointer}
.skip{background:#e3e6ec;color:var(--ink)}.obtns .take{flex:1.6;background:var(--g);color:#fff;font-weight:700}
.addr{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.addr b{display:block;font-size:17px}.addr small{color:var(--m);font-size:13px}
.dotA,.dotB{flex:none;width:12px;height:12px;border-radius:50%;margin-top:5px}
.dotA{background:var(--g)}.dotB{background:var(--r)}
.ridehead{display:flex;justify-content:space-between;align-items:center}
.chip{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:#e6efff;color:var(--b)}
.chip.green{background:#e3f6ea;color:#16883f}
.rprice{font-size:22px;font-weight:700;color:#16883f}
.rname{margin-top:10px;font-size:18px;font-weight:600}.rname span{font-size:14px;font-weight:400;color:var(--m);margin-left:6px}
.dialog{background:var(--c);border-radius:14px;padding:14px}
.who{font-size:13px;color:var(--m);margin-bottom:6px}.said{font-size:17px;line-height:1.4;margin-bottom:4px}
.choice{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;font-size:15px;color:var(--ink);background:#fff;border:1px solid #d9dce3;border-radius:12px;cursor:pointer}
.choice:hover{background:#eef1f6}
.result{background:#e8f7ee;border-radius:14px;padding:12px;margin-bottom:10px}
.rhead{display:flex;align-items:center;justify-content:space-between}
.result .x{background:none;border:none;font-size:22px;line-height:1;padding:0 4px;cursor:pointer;color:var(--ink)}
.rbig{font-size:26px;font-weight:700;color:#16883f;margin-top:4px}.rbig small{font-size:13px;font-weight:400;color:var(--m);margin-left:6px}
.rline{font-size:15px;margin-top:4px}.stars{color:#f5a300;letter-spacing:1px}.bad{color:#c0392b}
#ending{position:fixed;inset:0;background:rgba(10,12,18,.88);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:10}
#ending[hidden]{display:none}
#endcard{background:#2a3142;color:#fff;border:2px solid #7be08a;border-radius:16px;padding:22px;max-width:360px;width:100%}
#endcard h2{margin:0 0 4px;color:#7be08a;font-size:26px}
#endcard .title{color:#ffd166;font-size:18px;margin-bottom:14px}
#endcard .line{margin-top:7px;font-size:15px}
#endcard .sect{margin-top:16px;font-size:13px;opacity:.6;text-transform:uppercase}
.endbtn{display:block;width:100%;margin-top:10px;padding:12px;font-size:16px;border:none;border-radius:10px;color:#fff;background:#4a5163;cursor:pointer}
.endbtn.main{background:#2fa84f;font-weight:bold}

#zoom{position:absolute;z-index:2;right:10px;top:calc(env(safe-area-inset-top,0px) + 116px);display:flex;flex-direction:column;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.22);overflow:hidden}
#zoom button{width:44px;height:42px;border:none;background:#fff;font-size:24px;line-height:1;color:#3a4250;cursor:pointer}#zoom button+button{border-top:1px solid #e5e7eb}
#recenter{position:absolute;z-index:2;right:10px;top:calc(env(safe-area-inset-top,0px) + 212px);width:44px;height:44px;border:none;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:#3a4250;cursor:pointer}
#recenter[hidden]{display:none}
#map{touch-action:none;cursor:grab}#map.drag{cursor:grabbing}
.paychip{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:#f1f2f4;color:#374151}
.ohint{font-size:13px;color:var(--m)}
#ff{position:absolute;z-index:2;right:10px;top:calc(env(safe-area-inset-top,0px) + 68px);padding:6px 12px;border:none;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:14px;font-weight:700;cursor:pointer}
#ff[hidden]{display:none}
.dotS{flex:none;width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--o)}
.stopinfo{margin-top:12px;font-size:16px;font-weight:600;color:#b36b00;background:#fff4e0;border-radius:12px;padding:10px}
.kick{display:block;width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:#fde8e8;color:#b3261e;font-size:15px;cursor:pointer}
</style></head>
<body>
<div id="app">
  <canvas id="map"></canvas>
  <div id="topbar">
    <button class="pill status off" id="menubtn" aria-label="Меню"><span class="burger"><i></i><i></i><i></i></span><span class="dot"></span></button>
    <div class="pill" id="earn"><div class="money" id="money">0 ₽</div><div class="gbar"><i id="goalfill"></i></div></div>
    <button class="pill" id="fuelpill" aria-label="Топливо"><svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="1" y="1.5" width="7.5" height="13" rx="1.2"/><path d="M2.8 5h4M8.5 6.5l2.6 1.6v5a1.2 1.2 0 0 0 2.4 0V5.5L11 3"/></svg><span><b id="fuelL">50 л</b><span class="fbar"><i id="fuelfill"></i></span></span></button>
    <div class="pill" id="ratingpill"><div id="rating">★ 5.00</div><div class="sub" id="clock"></div></div>
  </div>
  <div id="pickbar" hidden><span>Нажмите на карте, куда вам нужно</span><button id="pickcancel">Отмена</button></div>
  <div id="osm">© участники OpenStreetMap</div>
  <button id="ff" hidden>⏩ ×1</button>
  <div id="zoom"><button id="zin" aria-label="Приблизить">+</button><button id="zout" aria-label="Отдалить">&minus;</button></div>
  <button id="recenter" hidden title="Вернуться к машине" aria-label="Вернуться к машине"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  <div id="sheet"><span class="grab"></span><div id="panel"></div><button id="shift" class="off"></button></div>
  <div id="menu" hidden>
    <div class="mback" data-close="1"></div>
    <aside class="mpanel">
      <div class="mhead"><b>Меню</b><button class="x" data-close="1" aria-label="Закрыть">×</button></div>
      <div class="mstatus status off" id="mstatus"><span class="dot"></span><span id="statustext">Не на линии</span></div>
      <div class="mstats">
        <div><span>Накоплено</span><b id="mmoney">0 ₽</b></div>
        <div><span>Цель</span><b id="goaltext"></b></div>
        <div><span>За смену</span><b id="mshift">0 ₽</b></div>
        <div><span>Поездок</span><b id="rides">0</b></div>
      </div>
      <div class="msect"><b>По делам</b><small id="bizinfo"></small><button id="bizbtn" class="mbtn"></button></div>
      <button id="reset">Сбросить прогресс</button>
    </aside>
  </div>
</div>
<div id="ledger" hidden><div class="askback" data-close="1"></div><div class="askcard"><div class="mhead"><b>Смена <span id="lday"></span></b><button class="x" data-close="1" aria-label="Закрыть">×</button></div><div id="lrows"></div></div></div>
<div id="ask" hidden><div class="askback"></div><div class="askcard"><b id="asktitle"></b><p id="asktext"></p>
  <div class="askbtns"><button id="askno">Отмена</button><button id="askok"></button></div></div></div>
<div id="ending" hidden><div id="endcard"></div></div>

<script src="dialogues.js"></script>
<script src="dialogues2.js"></script>
<script src="mapdata.js"></script>
<script src="osmmap.js"></script>
<script>
// ====== Карта: дороги Уфы из mapdata.js (координаты в метрах) ======
const D = MAPDATA, N = D.nodes, W = D.w, H = D.h, $ = id => document.getElementById(id);
const appEl = $("app"), canvas = $("map"), ctx = canvas.getContext("2d"), panel = $("panel");
const moneyEl = $("money"), ridesEl = $("rides"), ratingEl = $("rating"), shiftBtn = $("shift"), menuEl = $("menu");
const goalFill = $("goalfill"), goalText = $("goaltext"), statusPill = $("menubtn"), statusText = $("statustext");
const endingEl = $("ending"), endCard = $("endcard"), resetBtn = $("reset");

// ====== Настройки игры (можно менять!) ======
const PX_PER_M = 0.22;        // масштаб карты: пикселей на метр (больше - ближе)
const TIME_SCALE = 15;        // ускорение времени: во столько раз быстрее реальности едет машина
const KMH = [70, 50, 40, 30, 25, 15]; // скорость по типам дорог: магистраль, главная, средняя, обычная, жилая улица, двор (км/ч)
const BASE_FARE = 120, PER_KM = 27;     // цена: посадка + рубли за километр (подобрано так, чтобы за смену после всех расходов оставалось 4-6 тыс.)
const PICK_MIN = 800, PICK_MAX = 4500;  // как далеко от машины появляется клиент (метры)
const TRIP_MIN = 2000, TRIP_MAX = 16000; // длина поездки (метры по прямой)
const ORDER_TTL = 25, MAX_ORDERS = 1;   // заказ предлагается один: пока не примешь или не пропустишь, следующего нет
const SOFT_PICK = 20, SOFT_TRIP = 40, SOFT_KEEP = 0.3;   // длинные поездки сжимаются: всё, что дольше этих секунд, идёт в 3 раза быстрее
const SHIFT_LEN = 12 * 3600, DAY_START = 8 * 60;      // смена 12 игровых часов, начинается в 08:00
const LATE_SHARE = 0.10, LATE_MAX = 10;                // 10% пассажиров (с рейтингом ниже 4.85) опаздывают, но не больше чем на 10 с
const FREE_WAIT = 10, WAIT_RATE = 5;                     // остановка по просьбе: бесплатно 10 с, потом 5 ₽ за секунду
const REFUSE_AT = -3, AFF_MIN = -6, AFF_MAX = 10;
const GOAL = 5000;
const SAVE_KEY = "taxi-game-save-v1";
// Экономика водителя
const RENT = 2000;            // аренда машины за смену, списывается при первом выходе на линию в смене
const FEE = 0.25;             // комиссия таксопарка и сервиса с каждого заказа (с чаевых не берётся)
const FUEL_PRICE = 65;        // цена бензина, ₽ за литр
const FUEL_PER_KM = 0.063;    // расход: 6,3 л на 100 км - за смену (около 480 км) уходит примерно 30 л
const TANK = 50;              // объём бака, литров
const LOW_FUEL = 4;           // с таким остатком новые заказы не берём - нужно на заправку

// ====== Граф дорог: из каждой точки список дорог, по которым можно ехать ======
const adj = N.map(() => []), nameOf = new Array(N.length).fill(-1);
for (const [a, b, c, ow, nm] of D.edges) {
  const len = Math.hypot(N[a][0] - N[b][0], N[a][1] - N[b][1]), t = len / (KMH[c] / 3.6);
  adj[a].push({ to: b, len, t, c });
  if (!ow) adj[b].push({ to: a, len, t, c });   // ow = улица с односторонним движением
  if (nm >= 0) { if (nameOf[a] < 0) nameOf[a] = nm; if (nameOf[b] < 0) nameOf[b] = nm; }
}

// ====== Поиск самого быстрого пути (алгоритм A*, быстрый на большом городе) ======
function push(h, x) { h.push(x); let i = h.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (h[p][0] <= h[i][0]) break; [h[p], h[i]] = [h[i], h[p]]; i = p; } }
function pop(h) {
  const top = h[0], last = h.pop();
  if (h.length) { h[0] = last; let i = 0; for (;;) { const a = 2 * i + 1, b = a + 1; let m = i;
    if (a < h.length && h[a][0] < h[m][0]) m = a; if (b < h.length && h[b][0] < h[m][0]) m = b;
    if (m === i) break; [h[m], h[i]] = [h[i], h[m]]; i = m; } }
  return top;
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

let zoomUntil = 0;                                              // пока идёт масштабирование, слой карты не перерисовываем каждый кадр

// ====== Рисование ======
const MAP_BG = "#f0f1f4";   // фон карты (светло-серый, как в навигаторе)
const FILL = ["#ffffff", "#ffffff", "#ffffff", "#ffffff", "#ffffff", "#fbfbfc"],   // заливка дорог: все белые, как в навигаторе
      EDGE = ["#a9b3c0", "#b1bac6", "#bec5cf", "#c6ccd5", "#cdd2da", "#d6dae0"],   // обводка: у крупных дорог чуть темнее
      WPX = [5.5, 4.5, 3.6, 3, 2.4, 1.6];   // толщина в пикселях: магистраль, главная, средняя, обычная, жилая, двор
// ====== Реальная карта: вода, зелень, дома (из osmmap.js, данные OpenStreetMap) ======
// Контур в файле: [x0, y0, dx1, dy1, ...]; переводим в обычные координаты и запоминаем рамку, чтобы быстро отсеивать невидимое

    for (let i = 0; i < rings[0].length; i += 2) { const x = rings[0][i], y = rings[0][i + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }

const LAYERS = HAS_OSM ? [   // порядок = порядок рисования снизу вверх
  { items: decodeLayer(OSM.grass),     fill: "#e2efd8" },
  { items: decodeLayer(OSM.cemetery),  fill: "#dde6d9" },
  { items: decodeLayer(OSM.wood),      fill: "#cde5c1" },
  { items: decodeLayer(OSM.park),      fill: "#d2eac6" },
  { items: decodeLayer(OSM.water),     fill: "#aad3f2" },
  { items: decodeLayer(OSM.rivers),    line: "#aad3f2", width: 9, minPx: 1.5, open: true },   // небольшие реки линией
  { items: decodeLayer(OSM.buildings), fill: "#dfe1e6", stroke: "#cdd0d7", minScale: 0.09 }

    g.beginPath();
