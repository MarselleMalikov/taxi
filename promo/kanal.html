<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:720px;font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:#1E1F23;overflow:hidden;position:relative;background:#EEEBFF}
.map{position:absolute;inset:0;background:url(ufa_bg.png) center/cover no-repeat}
.hue{position:absolute;inset:0;background:#8E7BF2;mix-blend-mode:color;opacity:.75}
.tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(240,236,255,.78) 0%,rgba(236,231,255,.42) 30%,rgba(232,226,255,.38) 100%);mix-blend-mode:normal}
.head{position:absolute;left:72px;right:72px;top:58px;display:flex;align-items:baseline;justify-content:space-between}
h1{font-size:58px;font-weight:800;letter-spacing:-1.2px}
.sub{font-size:23px;font-weight:600;color:#4B3FA0}
.row{position:absolute;left:0;right:0;top:192px;display:flex;justify-content:center;gap:30px}
.fr{width:274px;height:456px;border-radius:40px;background:#1E1F23;padding:9px;box-shadow:0 26px 50px rgba(60,40,140,.30),0 4px 12px rgba(0,0,0,.18)}
.fr img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:32px;display:block}
</style></head><body><div class="map"></div><div class="hue"></div><div class="tint"></div>
<div class="head"><h1>Такси по Уфе</h1><span class="sub">Симулятор таксиста на настоящей карте города</span></div>
<div class="row"><div class="fr"><img src="shots/1_zakaz.png"></div><div class="fr"><img src="shots/2_razgovor.png"></div><div class="fr"><img src="shots/3_dozhd_noch.png"></div><div class="fr"><img src="shots/5_menu.png"></div></div>
</body></html>
